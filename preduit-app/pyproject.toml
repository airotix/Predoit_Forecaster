[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "preduit-app"
version = "0.1.0"
description = "Per-client Preduit FastAPI service"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "python-multipart",
    "uvicorn[standard]",
    "python-dotenv>=1.0.0",
    "pandas>=1.5.0",
    "numpy>=1.23.0",
    "PyJWT[crypto]>=2.8.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["preduit_app"]
python_files = ["test_*.py"]
