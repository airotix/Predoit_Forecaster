name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install packages (engine + app, with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install ./preduit-engine[dev] ./preduit-app[dev]
          pip install -r backend-ai/requirements.txt

      - name: Run engine tests
        working-directory: preduit-engine
        run: pytest -q

      - name: Run app tests
        working-directory: preduit-app
        run: pytest -q

      - name: Run fresh Joolan workflow tests
        working-directory: backend-ai
        run: python -B -m unittest discover -s tests

  frontend:
    name: Frontend lint + test + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci || npm install

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000/api
          NEXT_PUBLIC_AUTH_ENABLED: "false"
