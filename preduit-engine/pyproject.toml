[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "preduit-engine"
version = "0.1.0"
description = "Preduit forecasting ML pipeline (SARIMA + CatBoost) and SQLite helpers"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=1.5.0",
    "numpy>=1.23.0",
    "pmdarima>=2.0.0",
    "statsmodels>=0.13.0",
    "catboost>=1.2",
    "shap>=0.42.0",
    "scikit-learn>=1.2.0",
    "openpyxl>=3.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
