  # ==================== CARTES CADEAUX ====================
  /import-cartes-cadeaux.do:
    post:
      tags:
        - Cartes cadeaux
      summary: Créer une ou plusieurs cartes cadeaux
      description: |
        Crée une ou plusieurs cartes cadeaux (table `cartes_cadeaux`).

        **Permission requise :** `carte_cadeau`

        Le corps est un JSON, sous l'une des trois formes suivantes :
        - un tableau d'objets `[{...}, {...}]`
        - un objet unique `{...}`
        - un objet enveloppe `{"cartes": [{...}, {...}]}`

        Champs obligatoires : `Code_Barre`, `Date_Creation`, `Valeur`,
        `Validite_Debut`, `Validite_Fin`.

        Champs facultatifs : `Carte_Cadeau` (identifiant imposé, sinon auto-incrémenté),
        `Magasin_Createur`, `Entete_Createur`, `Client`, `Taux`, `Panier_Minimum`,
        `Ignorer_Produits_Remises`.

        Contrôles effectués avant toute écriture :
        - `Code_Barre` non vide, 36 caractères au maximum, unique dans le flux et en base
        - dates valides (format `AAAA-MM-JJ`) et `Validite_Fin` >= `Validite_Debut`
        - `Valeur` strictement positive (une valeur nulle n'est acceptée que pour une carte
          de remise portant un `Taux`), `Panier_Minimum` numérique positif, `Taux` entre 0 et 100
        - `Magasin_Createur`, `Client` et `Entete_Createur`, s'ils sont fournis, doivent exister
        - `Carte_Cadeau`, s'il est fourni, doit être libre

        **Tout ou rien** : à la première anomalie, rien n'est créé et l'appel renvoie l'erreur
        en indiquant le rang de la carte fautive. 1000 cartes au maximum par appel.
      operationId: importCartesCadeaux
      parameters:
        - $ref: '#/components/parameters/enseigne'
        - $ref: '#/components/parameters/apiKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                required:
                  - Code_Barre
                  - Date_Creation
                  - Valeur
                  - Validite_Debut
                  - Validite_Fin
                properties:
                  Carte_Cadeau:
                    type: integer
                    description: Identifiant imposé (facultatif, auto-incrémenté sinon)
                  Code_Barre:
                    type: string
                    maxLength: 36
                    description: Code barre de la carte, unique
                  Magasin_Createur:
                    type: string
                    description: Magasin émetteur (doit exister)
                  Entete_Createur:
                    type: integer
                    description: Ticket à l'origine de la carte (doit exister)
                  Date_Creation:
                    type: string
                    format: date
                  Valeur:
                    type: number
                    description: >-
                      Montant de la carte, strictement positif (une valeur nulle
                      n'est acceptée que pour une carte de remise portant un Taux)
                  Validite_Debut:
                    type: string
                    format: date
                  Validite_Fin:
                    type: string
                    format: date
                  Client:
                    type: integer
                    description: Client porteur de la carte (0 = aucun)
                  Taux:
                    type: number
                    description: Taux de remise en % (0 à 100)
                  Panier_Minimum:
                    type: number
                    description: Montant de panier minimum pour utiliser la carte
                  Ignorer_Produits_Remises:
                    type: integer
                    enum: [0, 1]
                    description: Exclure les produits déjà remisés du calcul
            example:
              - Code_Barre: "CC-2026-000001"
                Date_Creation: "2026-09-09"
                Valeur: 50
                Validite_Debut: "2026-09-09"
                Validite_Fin: "2027-09-08"
                Magasin_Createur: "PARIS"
                Client: 1234
              - Code_Barre: "CC-2026-000002"
                Date_Creation: "2026-09-09"
                Valeur: 0
                Validite_Debut: "2026-09-09"
                Validite_Fin: "2027-09-08"
                Taux: 10
                Panier_Minimum: 100
                Ignorer_Produits_Remises: 1
      responses:
        '200':
          description: Cartes créées
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    example: ok
                  data:
                    type: object
                    properties:
                      nombre:
                        type: integer
                      cartes:
                        type: array
                        items:
                          type: object
                          properties:
                            Carte_Cadeau:
                              type: integer
                            Code_Barre:
                              type: string
                            Valeur:
                              type: number
                            Validite_Debut:
                              type: string
                            Validite_Fin:
                              type: string
              example:
                result: ok
                data:
                  nombre: 2
                  cartes:
                    - Carte_Cadeau: 101
                      Code_Barre: "CC-2026-000001"
                      Valeur: 50
                      Validite_Debut: "2026-09-09"
                      Validite_Fin: "2027-09-08"
                    - Carte_Cadeau: 102
                      Code_Barre: "CC-2026-000002"
                      Valeur: 0
                      Validite_Debut: "2026-09-09"
                      Validite_Fin: "2027-09-08"
        '400':
          description: Erreur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                champ_manquant:
                  value:
                    result: ko
                    error_message: "carte 1 : Code_Barre obligatoire"
                doublon:
                  value:
                    result: ko
                    error_message: "carte 2 : le Code_Barre CC-2026-000001 existe déjà"
                date_invalide:
                  value:
                    result: ko
                    error_message: "carte 1 : Validite_Fin obligatoire ou invalide"
                permission:
                  value:
                    result: ko
                    error_message: "not authorized"
      security:
        - apiKey: []
          enseigne: []

