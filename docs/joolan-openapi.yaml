        Formats de corps acceptés : JSON (tableau d'objets), XLSX, TSV, CSV (séparateur `;`).

        Clés : `Profil_Stock`, `Produit` ; `Couleur` et `Taille` sont prises en compte
        si présentes. Les autres colonnes (ex. `Mini`, `Maxi`) sont insérées dans
        `produits_min_max`. Le profil de stock est créé automatiquement s'il n'existe pas.
      operationId: importMinMax
      parameters:
        - $ref: '#/components/parameters/enseigne'
        - $ref: '#/components/parameters/apiKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                required:
                  - Profil_Stock
                  - Produit
                properties:
                  Profil_Stock:
                    type: string
                  Produit:
                    type: string
                  Couleur:
                    type: string
                  Taille:
                    type: string
                  Mini:
                    type: integer
                  Maxi:
                    type: integer
            example:
              - Profil_Stock: "STANDARD"
                Produit: "TSHIRT-001"
                Couleur: "BLANC"
                Taille: "M"
                Mini: 5
                Maxi: 20
          text/plain:
            schema:
              type: string
              description: Données TSV ou CSV (séparateur `;`) avec en-têtes
            example: |
              Profil_Stock	Produit	Couleur	Taille	Mini	Maxi
              STANDARD	TSHIRT-001	BLANC	M	5	20
          application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Import réussi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                result: ok
        '400':
          description: Erreur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                result: ko
                error_message: "invalid api key"
      security:
        - apiKey: []
          enseigne: []

  /import-objectifs.do:
    post:
      tags:
        - Import Divers
      summary: Importer des objectifs de chiffre d'affaires
      description: |
        Import des objectifs de chiffre d'affaires par magasin et par jour (table
        `objectifs_magasins`), comme l'import de fichier de l'écran « Objectifs de chiffre
        d'affaires par magasin ». Un objectif déjà fixé pour le même magasin et la même date
        est remplacé.

        **Permission requise :** `api_import_objectifs`

        Formats de corps acceptés : JSON (tableau d'objets), TSV ou CSV (séparateur `;`).

        Ligne d'en-tête obligatoire nommant les colonnes `Magasin`, `Date` et `Objectif`, dans un
        ordre quelconque (casse indifférente ; les autres colonnes sont ignorées). En JSON, les
        clés de chaque objet tiennent lieu d'en-tête.
        Date au format `AAAA-MM-JJ` ou `JJ/MM/AAAA` ; objectif avec `.` ou `,` décimal.

        Rien n'est importé si un magasin n'existe pas, si une date ou un objectif est invalide.
      operationId: importObjectifs
      parameters:
        - $ref: '#/components/parameters/enseigne'
        - $ref: '#/components/parameters/apiKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                required:
                  - Magasin
                  - Date
                  - Objectif
                properties:
                  Magasin:
                    type: string
                  Date:
                    type: string
                    format: date
                  Objectif:
                    type: number
            example:
              - Magasin: "PARIS"
                Date: "2026-10-05"
                Objectif: 1500
              - Magasin: "PARIS"
                Date: "2026-10-06"
                Objectif: 1750.5
          text/plain:
            schema:
              type: string
              description: Données TSV ou CSV (séparateur `;`), ligne d'en-tête obligatoire
            example: |
              Date	Magasin	Objectif
              2026-10-05	PARIS	1500
              06/10/2026	PARIS	1750,50
      responses:
        '200':
          description: Import réussi
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    example: ok
                  data:
                    type: object
                    properties:
                      nombre:
                        type: integer
                        description: Nombre de lignes importées
              example:
                result: ok
                data:
                  nombre: 2
        '400':
          description: Erreur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                magasin:
                  value:
                    result: ko
                    error_message: "Les magasins suivants n'existent pas : LYON"
                date:
                  value:
                    result: ko
                    error_message: "Une ou plusieurs dates invalides : 2026-13-01"
                entete:
                  value:
                    result: ko
                    error_message: "Ligne d'entête invalide : les colonnes Magasin, Date et Objectif sont obligatoires"
      security:
        - apiKey: []
          enseigne: []

