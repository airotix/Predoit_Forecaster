  # ==================== TAX-FREE ====================
  /planet-pii.do:
    get:
      tags:
        - Tax-Free
      summary: Export XML Tax-Free (Planet PII)
      description: |
        Exporte les données d'une transaction au format XML Planet PII pour le traitement tax-free.

        **Permission requise :** `api_planet_pii`

        Le fichier XML contient :
        - Données marchand (nom, adresse, TVA)
        - Détails transaction (date, heure, numéro facture)
        - Lignes articles avec TVA
        - Méthodes de paiement
        - Données client (si disponibles)
      operationId: planetPiiExport
      parameters:
        - $ref: '#/components/parameters/enseigne'
        - $ref: '#/components/parameters/apiKey'
        - name: Entete
          in: query
          required: true
          schema:
            type: integer
          description: Numéro d'entête du ticket (VENTE ou AVOIR)
      responses:
        '200':
          description: Fichier XML Planet PII
          content:
            text/xml:
              schema:
                type: string
                format: binary
          headers:
            Content-Disposition:
              schema:
                type: string
              description: 'attachment; filename="Planet_PII.XML"'
        '400':
          description: Erreur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                entete_not_found:
                  value:
                    result: ko
                    error_message: "Entete not found"
      security:
        - apiKey: []
          enseigne: []


  # ==================== COMPTABILITE ====================
  /export-ecritures-comptables-retail.do:
    get:
      tags:
        - Comptabilité
      summary: Export des écritures comptables retail
      description: |
        Produit le fichier d'écritures comptables des ventes retail d'une société sur une période,
        exactement comme l'écran Comptabilité > Export comptable (même moteur, même paramétrage
        comptable : journaux, comptes des modes de règlement, banques, TVA, dépenses).

        **Permission requise :** `api_export_ecritures_comptables`

        Formats :
        - `fec` : Fichier des Écritures Comptables (tabulé) — `fec.txt`
        - `csv` : CSV séparé par des points-virgules — `pont-comptable.csv`
        - `cegid` : Cegid TRA — `PGI001.TRA`
        - `sage` : Sage PNM avec analytique — `export_sage.pnm`
        - `sage138` : Sage PNM sans analytique — `export_sage.pnm`

        En cas de succès, le fichier est renvoyé tel quel (`text/plain`, en pièce jointe).
        En cas d'erreur (paramètre invalide, paramétrage comptable incomplet…), la réponse est en JSON.
      operationId: exportEcrituresComptablesRetail
      parameters:
        - $ref: '#/components/parameters/enseigne'
        - $ref: '#/components/parameters/apiKey'
        - name: Societe
          in: query
          required: true
          schema:
            type: string
          description: Société (telle que renseignée sur les magasins)
          example: "SOC1"
        - name: Format
          in: query
          required: true
          schema:
            type: string
            enum: [fec, csv, cegid, sage, sage138]
          description: Format du fichier d'export
          example: "fec"
        - name: Centralisation
          in: query
          required: true
          schema:
            type: string
            enum: [aucune, quotidienne, mensuelle]
          description: "Type de centralisation : aucune (une écriture par pièce), quotidienne ou mensuelle"
          example: "quotidienne"
        - name: date_debut
          in: query
          required: true
          schema:
            type: string
            format: date
          description: Date de début de période (AAAA-MM-JJ)
          example: "2026-09-01"
        - name: date_fin
          in: query
          required: true
          schema:
            type: string
            format: date
          description: Date de fin de période (AAAA-MM-JJ)
          example: "2026-09-30"
      responses:
        '200':
          description: Fichier d'export comptable
          content:
            text/plain:
              schema:
                type: string
                format: binary
          headers:
            Content-Disposition:
              schema:
                type: string
              description: 'attachment; filename="fec.txt"'
        '400':
          description: Erreur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                format_invalide:
                  value:
                    result: ko
                    error_message: "Format parameter required : fec|csv|cegid|sage|sage138"
                parametrage_incomplet:
                  value:
                    result: ko
                    error_message: "Comptes non paramétrés sur ces modes de règlement : CB,ESP"
      security:
        - apiKey: []
          enseigne: []


  # ==================== RAPPORTS ====================
  /generation-rapports.do:
    post:
      tags:
        - Rapports
      summary: Générer une URL de rapport
      description: |
        Génère une URL pour télécharger un rapport au format PDF ou HTML.

        **Permission requise :** `api_generation_rapports`

        Le rapport est identifié par son ID dans la table `fat` (Type='document').
        Les paramètres additionnels sont passés au rapport pour filtrer les données.
      operationId: generationRapports
      parameters:
        - $ref: '#/components/parameters/enseigne'
        - $ref: '#/components/parameters/apiKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id_rapport
              properties:
                id_rapport:
                  type: string
                  description: ID du rapport dans la table fat (Type='document')
                parametres:
                  type: array
                  description: Paramètres additionnels pour le rapport
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                        description: Nom du paramètre
                      value:
                        type: string
                        description: Valeur du paramètre
                format:
                  type: string
                  enum: [pdf, html]
                  default: pdf
                  description: Format de sortie (pdf ou html)
            example:
              id_rapport: "12345"
              parametres:
                - name: "Date_Debut"
                  value: "2026-01-01"
                - name: "Date_Fin"
                  value: "2026-01-31"
              format: "pdf"
      responses:
        '200':
          description: URL du rapport générée
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    example: ok
                  url:
                    type: string
                    description: URL pour télécharger le rapport
              example:
                result: ok
                url: "https://pdf2.joolan.com/api/render?url=..."
        '400':
          description: Erreur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                rapport_not_found:
                  value:
                    result: ko
                    error_message: "Report not found"
                format_invalide:
                  value:
                    result: ko
                    error_message: "format invalide (pdf ou html attendu)"
      security:
        - apiKey: []
          enseigne: []

  /import-rapports.do:
    post:
      tags:
        - Rapports
      summary: Créer des rapports
      description: |
        Crée (ou remplace) un ou plusieurs rapports « États et rapports » : documents de la table
        `fat` (Type='document'), dont le contenu est rangé dans `diversblob`.
        L'`id_rapport` renvoyé se passe tel quel à `/generation-rapports.do`.

        **Permission requise :** `api_import_rapports`

        Le corps est un JSON, sous l'une des trois formes suivantes :
        - un tableau d'objets `[{...}, {...}]`
        - un objet unique `{...}` — **le fichier produit par le bouton « Exporter » d'un document
          peut être posté tel quel**
        - un objet enveloppe `{"rapports": [{...}, {...}]}`

        Champs obligatoires : `nom`, `requete`.

        **`parametres`, `builder` et `graphique` sont des chaînes de caractères** contenant le texte
        JSON, exactement comme dans le fichier d'export (à la différence de `/generation-rapports.do`,
        où `parametres` est un vrai tableau). Un objet ou un tableau est refusé.

        Rangement :
        - `univers` : `documents` (défaut), `produits`, `rapports negoce`, `rapports production`,
          `rapports clients`, `rapports magasin` ou `logistic` — l'écran dans lequel le rapport apparaît
        - `dossier` : chemin de dossiers séparés par `/` (ex. `Ventes/Mensuel`), créés au besoin ;
          absent = racine de l'univers
        - `id_dossier` : identifiant d'un dossier existant (à la place de `dossier`)

        `univers`, `dossier`, `id_dossier` et `remplacer` peuvent aussi être passés dans l'URL :
        ils valent alors pour tous les rapports du flux qui ne les précisent pas.

        Un rapport de même nom au même endroit est **refusé**, sauf avec `remplacer=1` : il garde
        alors son `id_rapport` (planifications et liens conservés) et son contenu est **écrasé en entier**
        (un champ absent vide la partie correspondante). L'URL de web service d'un document n'est pas gérée.

        **Tout ou rien** : à la première anomalie, rien n'est créé et l'erreur indique le rang du
        rapport fautif. 200 rapports au maximum par appel.
      operationId: importRapports
      parameters:
        - $ref: '#/components/parameters/enseigne'
        - $ref: '#/components/parameters/apiKey'
        - name: univers
          in: query
          required: false
          schema:
            type: string
          description: Univers par défaut des rapports du flux
        - name: dossier
          in: query
          required: false
          schema:
            type: string
          description: Chemin de dossier par défaut (ex. `Ventes/Mensuel`)
        - name: id_dossier
          in: query
          required: false
          schema:
            type: string
          description: Dossier existant par défaut
        - name: remplacer
          in: query
          required: false
          schema:
            type: integer
            enum: [0, 1]
          description: Écraser par défaut les rapports existants de même nom
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                required:
                  - nom
                  - requete
                properties:
                  nom:
                    type: string
                    maxLength: 100
                    description: Nom du rapport (unique dans son dossier)
                  requete:
                    type: string
                    description: Requête SQL du rapport (exécutée en lecture seule à la génération)
                  parametres:
                    type: string
                    description: Texte JSON du tableau des paramètres, tel que saisi dans l'écran du document
                  memo:
                    type: string
                    description: Description du rapport
                  builder:
                    type: string
                    description: Modèle du constructeur de requête (texte JSON, issu d'un export)
                  graphique:
                    type: string
                    description: Configuration du graphique (texte JSON, issu d'un export)
                  univers:
                    type: string
                    default: documents
                  dossier:
                    type: string
                    description: Chemin de dossiers séparés par `/`, créés au besoin
                  id_dossier:
                    type: string
                    description: Dossier existant (à la place de `dossier`)
                  remplacer:
                    type: integer
                    enum: [0, 1]
                    default: 0
            example:
              - nom: "CA par magasin"
                dossier: "Ventes/Mensuel"
                requete: "select Magasin, sum(Total_TTC) as CA from entetes where (Date between '{{debut}}' and '{{fin}}') group by Magasin /* joolan: sum_CA */;"
                parametres: "[{title:\"Du\", name:\"debut\", type:\"date\", default:\"dm\"}, {title:\"Au\", name:\"fin\", type:\"date\", default:\"fm\"}]"
                memo: "Chiffre d'affaires TTC par magasin sur la période"
      responses:
        '200':
          description: Rapports créés ou remplacés
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    example: ok
                  data:
                    type: object
                    properties:
                      nombre:
                        type: integer
                      rapports:
                        type: array
                        items:
                          type: object
                          properties:
                            id_rapport:
                              type: string
                              description: À passer à /generation-rapports.do
                            nom:
                              type: string
                            univers:
                              type: string
                            id_dossier:
                              type: string
                              description: Dossier de rangement ('' = racine)
                            dossier:
                              type: string
                            action:
                              type: string
                              enum: [creation, remplacement]
              example:
                result: ok
                data:
                  nombre: 1
                  rapports:
                    - id_rapport: "5f2b7c1e-8a41-11f1-9c3e-00163e5e6c00"
                      nom: "CA par magasin"
                      univers: "documents"
                      id_dossier: "5f2b6d8a-8a41-11f1-9c3e-00163e5e6c00"
                      dossier: "Ventes/Mensuel"
                      action: creation
        '400':
          description: Erreur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                champ_manquant:
                  value:
                    result: ko
                    error_message: "rapport 1 (CA par magasin) : requete obligatoire"
                existe_deja:
                  value:
                    result: ko
                    error_message: "rapport 1 (CA par magasin) : ce rapport existe déjà (id_rapport 5f2b7c1e-...), utiliser remplacer=1 pour l'écraser"
                parametres_structures:
                  value:
                    result: ko
                    error_message: "parametres doit être une chaîne de caractères (le texte JSON des paramètres, comme dans le fichier d'export d'un document)"
                permission:
                  value:
                    result: ko
                    error_message: "not authorized"
      security:
        - apiKey: []
          enseigne: []

  /attribution-ean.do:
    post:
      tags:
        - Import Produits
      summary: Attribuer des codes EAN
      description: |
        Attribue des codes EAN aux déclinaisons (SKU) qui n'en ont pas, comme le bouton
        « Attribuer automatiquement les codes EAN » de la fiche produit : chaque code suit le
        dernier code EAN du dossier (paramètre `dernier_ean`), clé de contrôle comprise, et ce
        compteur est avancé d'autant.

        **Permission requise :** `api_attribution_ean`

        Chaque ligne désigne une ou plusieurs déclinaisons par son champ `produit` :
        - `"#123"` (commence par `#`) : le SKU 123 ; `couleur` et `taille` sont ignorées
        - un code produit avec `couleur` et `taille` : cette déclinaison
        - un code produit avec `couleur` seule : toutes les tailles de cette couleur
          (et inversement avec `taille` seule)
        - un code produit seul : **toute la déclinaison du produit**

        Une déclinaison qui a déjà un code EAN le **garde** (statut `deja_present`).
        Une ligne sans correspondance ne bloque pas les autres (statut `introuvable`).

        Le corps est un JSON : un tableau de lignes, une ligne seule, ou `{"lignes": [...]}`.
        1000 lignes au maximum par appel.

        Lecture du compteur, calcul des codes et mises à jour se font dans **une seule
        transaction**, compteur verrouillé : deux appels simultanés ne distribuent jamais
        les mêmes codes. Sans dernier code EAN valide (12 ou 13 chiffres) paramétré dans le
        dossier, l'appel est refusé et rien n'est modifié.
      operationId: attributionEan
      parameters:
        - $ref: '#/components/parameters/enseigne'
        - $ref: '#/components/parameters/apiKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                required:
                  - produit
                properties:
                  produit:
                    type: string
                    description: Code produit, ou `#` suivi d'un numéro de SKU
                  couleur:
                    type: string
                    description: Restreint à cette couleur (ignorée pour un SKU)
                  taille:
                    type: string
                    description: Restreint à cette taille (ignorée pour un SKU)
            example:
              - produit: "ANGELA"
              - produit: "JULIA"
                couleur: "Bleu"
              - produit: "JULIA"
                couleur: "Rouge"
                taille: "M"
              - produit: "#1234"
      responses:
        '200':
          description: Codes attribués
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    example: ok
                  data:
                    type: object
                    properties:
                      nombre_attribues:
                        type: integer
                        description: Nombre de codes EAN distribués par cet appel
                      dernier_ean:
                        type: string
                        description: Valeur du compteur après l'appel
                      lignes:
                        type: array
                        items:
                          type: object
                          properties:
                            ligne:
                              type: integer
                              description: Rang de la ligne dans le flux (à partir de 1)
                            produit:
                              type: string
                            couleur:
                              type: string
                            taille:
                              type: string
                            statut:
                              type: string
                              enum: [ok, introuvable]
                            skus:
                              type: array
                              items:
                                type: object
                                properties:
                                  sku:
                                    type: integer
                                  produit:
                                    type: string
                                  couleur:
                                    type: string
                                  taille:
                                    type: string
                                  ean:
                                    type: string
                                  statut:
                                    type: string
                                    enum: [attribue, deja_present]
              example:
                result: ok
                data:
                  nombre_attribues: 1
                  dernier_ean: "1000000008326"
                  lignes:
                    - ligne: 1
                      produit: "#1234"
                      couleur: ""
                      taille: ""
                      statut: ok
                      skus:
                        - sku: 1234
                          produit: "JULIA"
                          couleur: "Rouge"
                          taille: "M"
                          ean: "1000000008326"
                          statut: attribue
        '400':
          description: Erreur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                compteur:
                  value:
                    result: ko
                    error_message: "aucun dernier code EAN valide n'est paramétré"
                sku_invalide:
                  value:
                    result: ko
                    error_message: "ligne 2 : #12a n'est pas un SKU valide"
                permission:
                  value:
                    result: ko
                    error_message: "not authorized"
      security:
        - apiKey: []
          enseigne: []
