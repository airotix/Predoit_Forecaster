openapi: 3.0.3
info:
  title: Joolan API
  description: |
    API REST pour la gestion des données Joolan (stocks, clients, tickets, produits, logistique, négoce B2B, etc.)

    ## Authentification
    Toutes les requêtes nécessitent :
    - `enseigne` : nom de l'enseigne (base de données)
    - `api-key` : clé API avec les permissions appropriées

    ## Formats d'import
    Les APIs d'import acceptent plusieurs formats dans le body :
    - JSON (tableau d'objets)
    - XLSX (fichier Excel)
    - TSV (séparateur tabulation)
    - CSV (séparateur point-virgule `;`)

    L'ordre des colonnes est libre, seuls les noms doivent correspondre.

    ## Permissions API
    Chaque endpoint nécessite une permission spécifique, matérialisée par la colonne
    `api_<permission>` de la table `api_keys` (ex. permission `stock` → colonne `api_stock`).

    | Permission (`api_…`) | Endpoint(s) |
    |---|---|
    | `api_stock` | `/stock.do`, `/image-stocks.do`, `/image-full-stocks.do` |
    | `api_recherche_clients` | `/recherche-clients.do` |
    | `api_import_clients` | `/import-clients.do` |
    | `api_export_tickets` | `/export-tickets.do` |
    | `api_import_tickets` | `/import-tickets.do` |
    | `api_annulation_tickets` | `/annulation-ticket.do` |
    | `api_ticket_pdf` | `/ticket-pdf.do` |
    | `api_compteurs_passages` | `/import-compteurs-passages.do` |
    | `api_import_produits` | `/import-produits.do` |
    | `api_import_tarifs` | `/import-tarifs.do` |
    | `api_import_produits_associes` | `/import-produits-associes.do` |
    | `api_import_champs_perso` | `/import-champs-perso.do` |
    | `api_import_min_max` | `/import-min-max.do` |
    | `api_import_fournisseurs` | `/import-fournisseurs.do` |
    | `api_import_receptions` | `/import-receptions.do`, `/import-bl-fournisseur.do`, `/associer-receptions-commandes.do` |
    | `api_import_scanners` | `/import-scanners.do` |
    | `api_import_transferts` | `/import-transferts.do` |
    | `api_import_commandes_fournisseurs` | `/import-commandes-fournisseurs.do` |
    | `api_import_image_stock` | `/import-image-stock.do` |
    | `api_envoyer_message` | `/envoyer-message.do` |
    | `api_carte_cadeau` | `/import-cartes-cadeaux.do` |
    | `api_catalogue` | `/catalogue-web.do` |
    | `api_logistique` | `/logistique.do` |
    | `api_negoce` | `/negoce.do`, `/import-clients-negoce.do` |
    | `api_planet_pii` | `/planet-pii.do` |
    | `api_generation_rapports` | `/generation-rapports.do` |
    | `api_import_rapports` | `/import-rapports.do` |
    | `api_attribution_ean` | `/attribution-ean.do` |
    | `api_import_objectifs` | `/import-objectifs.do` |
    | `api_export_ecritures_comptables` | `/export-ecritures-comptables-retail.do` |
    | `api_query` | `/query.do` |
    | *(aucune)* | `/ean-existe.do` (pas de contrôle de clé API) |
  version: 2.0.0
  contact:
    name: Joolan
    email: serge@joolan.com

servers:
  - url: https://{domain}/api/v2
    variables:
      domain:
        default: www.example.com
        description: Domaine de l'enseigne

tags:
  - name: Catalogue
    description: Catalogue produits e-commerce
  - name: Stock
    description: Consultation des stocks
  - name: Clients
    description: Gestion des clients
  - name: Tickets
    description: Export et gestion des tickets
  - name: Import Produits
    description: Import de données produits
  - name: Import Mouvements
    description: Import de réceptions, transferts, etc.
  - name: Import Divers
    description: Autres imports
  - name: Cartes cadeaux
    description: Création de cartes cadeaux
  - name: Logistique
    description: API logistique (réceptions, expéditions, tracking)
  - name: Négoce B2B
    description: Gestion des pièces commerciales B2B (devis, commandes, BL, factures)
  - name: Tax-Free
    description: Export données tax-free (Planet PII)
  - name: Comptabilité
    description: Export des écritures comptables
  - name: Rapports
    description: Génération de rapports PDF/HTML

components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: query
      name: api-key
      description: Clé API avec permissions appropriées
    enseigne:
      type: apiKey
      in: query
      name: enseigne
      description: Nom de l'enseigne

  parameters:
    enseigne:
      name: enseigne
      in: query
      required: true
      schema:
        type: string
      description: Nom de l'enseigne
    apiKey:
      name: api-key
      in: query
      required: true
      schema:
        type: string
      description: Clé API

  schemas:
    SuccessResponse:
      type: object
      properties:
        result:
          type: string
          enum: [ok]
        data:
          type: object

    ErrorResponse:
      type: object
      properties:
        result:
          type: string
          enum: [ko]
        error_message:
          type: string

    ImportResponse:
      type: object
      properties:
        result:
          type: string
          enum: [ok]
        data:
          type: object
          properties:
            imported:
              type: integer
              description: Nombre de lignes importées

    AdresseLivraison:
      type: object
      properties:
        Nom:
          type: string
        Adresse1:
          type: string
        Adresse2:
          type: string
        Adresse3:
          type: string
        Code_Postal:
          type: string
        Ville:
          type: string
        Pays:
          type: string
        Pays_Code3:
          type: string
        Pays_Code2:
          type: string
        Pays_Code_iso:
          type: string
        Contact:
          type: string
        Telephone:
          type: string
        email:
          type: string

    ProduitLogistique:
      type: object
      properties:
        Ligne:
          type: integer
        SKU:
          type: integer
        EAN:
          type: string
        Reference_Fournisseur:
          type: string
        Produit:
          type: string
        Couleur:
          type: string
        Taille:
          type: string
        Quantite:
          type: number

    ProduitNegoce:
      type: object
      properties:
        Produit:
          type: string
          description: Code produit
        Couleur:
          type: string
        Taille:
          type: string
        Designation:
          type: string
        Quantite:
          type: number
        Prix_Vente:
          type: number
        Remise_Vente:
          type: number
        Commentaire:
          type: string
          description: Commentaire de ligne (alimente negoce_lignes.Commentaire)
        Colis:
          type: integer
          default: 1
        Numero_Serie:
          type: string
        Ligne_Commande:
          type: integer
        Ligne_BL:
          type: integer

paths:
  # ==================== STOCK ====================
  /stock.do:
    get:
      tags:
        - Stock
      summary: Consulter le stock d'un produit
      description: Retourne les informations de stock pour un produit donné
      operationId: getStock
      parameters:
        - $ref: '#/components/parameters/enseigne'
        - $ref: '#/components/parameters/apiKey'
        - name: Produit
          in: query
          required: true
          schema:
            type: string
          description: Code produit
          example: "TSHIRT-001"
        - name: Couleur
          in: query
          required: false
          schema:
            type: string
          description: Code couleur (optionnel)
          example: "BLANC"
        - name: Taille
          in: query
          required: false
          schema:
            type: string
          description: Code taille (optionnel)
          example: "M"
        - name: Magasins
          in: query
          required: false
          schema:
            type: string
          description: Liste des magasins séparés par point-virgule
          example: "PARIS;LYON"
      responses:
        '200':
          description: Succès
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    enum: [ok]
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        Magasin:
                          type: string
                        Produit:
                          type: string
                        Couleur:
                          type: string
                        Taille:
                          type: string
                        En_Stock:
                          type: number
                        Disponible:
                          type: number
                        En_Reservation:
                          type: number
                        Sku:
                          type: integer
                        EAN:
                          type: string
              example:
                result: ok
                data:
                  - Magasin: "PARIS"
                    Produit: "TSHIRT-001"
                    Couleur: "BLANC"
                    Taille: "M"
                    En_Stock: 25
                    Disponible: 20
                    En_Reservation: 5
                    Sku: 12345
                    EAN: "3760123456789"
        '400':
          description: Erreur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                result: ko
                error_message: "invalid api key"
      security:
        - apiKey: []
          enseigne: []

  /ean-existe.do:
    get:
      tags:
        - Stock
      summary: Vérifier si un EAN existe
      description: |
        Vérifie l'existence d'un code EAN dans la base et retourne les informations produit associées.

        ⚠️ Cet endpoint n'effectue **aucun contrôle de clé API** (`check_api_key` n'est pas appelé).

        La réponse est en **texte brut** (pas du JSON) :
        - Si l'EAN existe : `OK` suivi de 8 lignes (séparateur `\n`) : EAN, `Produit Couleur Taille`, Désignation, Unité, Marque, Prix de vente formaté, Remise formatée.
        - Si l'EAN n'existe pas : `KO` suivi de l'EAN demandé.

        Si `enseigne` ou `ean` est absent, la requête se termine sans aucun contenu.
      operationId: checkEan
      parameters:
        - $ref: '#/components/parameters/enseigne'
        - name: ean
          in: query
          required: true
          schema:
            type: string
          description: Code EAN à vérifier
          example: "3760123456789"
      responses:
        '200':
          description: Réponse en texte brut (OK + détails produit, ou KO + EAN)
          content:
            text/plain:
              schema:
                type: string
              example: |
                OK
                3760123456789
                TSHIRT-001 BLANC M
                T-shirt coton
                PIECE
                MaMarque
                19,90 €
                0 %
      security:
        - enseigne: []

  # ==================== CLIENTS ====================
  /recherche-clients.do:
    post:
      tags:
        - Clients
      summary: Rechercher des clients
      description: Recherche de clients par critères
      operationId: searchClients
      parameters:
        - $ref: '#/components/parameters/enseigne'
        - $ref: '#/components/parameters/apiKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                Search:
                  type: array
                  items:
                    type: object
                    properties:
                      Field:
                        type: string
                        description: "Nom du champ (ex: Email, Mobile, Carte_Fidelite)"
                      Value:
                        type: string
                        description: Valeur recherchée
            example:
              Search:
                - Field: Email
                  Value: client@example.com
      responses:
        '200':
          description: Succès
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    enum: [ok]
                  count:
                    type: integer
                  data:
                    type: array
                    items:
                      type: object
              example:
                result: ok
                count: 1
                data:
                  - Client: 138
                    Nom: "DUPONT"
                    Prenom: "Jean"
                    Email: "client@example.com"
                    Mobile: "+33612345678"
        '400':
          description: Erreur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                result: ko
                error_message: "invalid api key"
      security:
        - apiKey: []
          enseigne: []

  /import-clients.do:
    post:
      tags:
        - Clients
      summary: Importer des clients
      description: |
        Import de fiches clients (création ou mise à jour sur clé unique).

        **Permission requise :** `import_clients`

        Formats acceptés : JSON, XLSX, TSV, CSV. L'ordre des colonnes est libre ;
        seules les colonnes correspondant à un champ de la table `clients` sont importées.
        - Colonne `Categorie` : alimente automatiquement la table `categories_clients`.
        - Colonnes préfixées `perso_<nom>` : créées comme champs personnalisés (`liste_champs_perso` / `champs_perso`).
      operationId: importClients
      parameters:
        - $ref: '#/components/parameters/enseigne'
        - $ref: '#/components/parameters/apiKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                properties:
                  Client:
                    type: integer
                    description: Identifiant client (clé pour mise à jour)
                  Nom:
                    type: string
                  Prenom:
                    type: string
                  email:
                    type: string
                  Mobile:
                    type: string
                  Adresse:
                    type: string
                  CodePostal:
                    type: string
                  Ville:
                    type: string
                  Carte_Fidelite:
                    type: string
                  Categorie:
                    type: string
                    description: Catégorie client (créée si inexistante)
            example:
              - Nom: "DUPONT"
                Prenom: "Jean"
                email: "jean.dupont@example.com"
                Mobile: "+33612345678"
                Ville: "PARIS"
          text/plain:
            schema:
              type: string
              description: Données TSV ou CSV avec en-têtes
          application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
            schema:
              type: string
              format: binary
              description: Fichier XLSX
      responses:
        '200':
          description: Import réussi — liste des clients créés ou modifiés
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    enum: [ok]
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        Client:
                          type: integer
                        Nom:
                          type: string
                        Prenom:
                          type: string
                        email:
                          type: string
                        Carte_Fidelite:
                          type: string
              example:
                result: ok
                data:
                  - Client: 138
                    Nom: "DUPONT"
                    Prenom: "Jean"
                    email: "jean.dupont@example.com"
                    Carte_Fidelite: ""
        '400':
          description: Erreur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                result: ko
                error_message: "invalid api key"
      security:
        - apiKey: []
          enseigne: []

  # ==================== TICKETS ====================
  /export-tickets.do:
    get:
      tags:
        - Tickets
      summary: Exporter les tickets d'une journée
      description: Retourne les entêtes, lignes et règlements des tickets d'une date donnée
      operationId: exportTickets
      parameters:
        - $ref: '#/components/parameters/enseigne'
        - $ref: '#/components/parameters/apiKey'
        - name: Date
          in: query
          required: true
          schema:
            type: string
            format: date
          description: Date au format AAAA-MM-JJ
          example: "2026-01-15"
      responses:
        '200':
          description: Succès
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    enum: [ok]
                  data:
                    type: object
                    properties:
                      entetes:
                        type: array
                        items:
                          type: object
                      lignes:
                        type: array
                        items:
                          type: object
                      reglements:
                        type: array
                        items:
                          type: object
              example:
                result: ok
                data:
                  entetes:
                    - Entete: 12345
                      Magasin: "PARIS"
                      Date: "2026-01-15"
                      Nature: "VENTE"
                      Total_TTC: 149.90
                  lignes:
                    - Entete: 12345
                      Produit: "TSHIRT-001"
                      Couleur: "BLANC"
                      Taille: "M"
                      Quantite: 2
                      Prix_Vente: 49.90
                  reglements:
                    - Entete: 12345
                      Mode: "CB"
                      Montant: 149.90
        '400':
          description: Erreur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                result: ko
                error_message: "invalid api key"
      security:
        - apiKey: []
          enseigne: []

  /annulation-ticket.do:
    post:
      tags:
        - Tickets
      summary: Annuler un ticket
      description: Annule un ticket existant en indiquant son numéro d'entête et un motif d'annulation
      operationId: cancelTicket
      parameters:
        - $ref: '#/components/parameters/enseigne'
        - $ref: '#/components/parameters/apiKey'
        - name: Entete
          in: query
          required: true
          schema:
            type: integer
          description: Numéro d'entête du ticket à annuler
          example: 12345
        - name: Motif
          in: query
          required: true
          schema:
            type: string
          description: Motif de l'annulation
          example: "Erreur de saisie"
      responses:
        '200':
          description: Succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                result: ok
        '400':
          description: Erreur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                result: ko
                error_message: "Motif parameter missing"
      security:
        - apiKey: []
          enseigne: []

  /ticket-pdf.do:
    get:
      tags:
        - Tickets
      summary: Générer le PDF d'un ticket
      description: |
        Retourne le ticket au format PDF, encodé en base64 dans la réponse JSON
        (champ `pdf_content`). Le format de rendu est choisi via le paramètre `format`.
      operationId: getTicketPdf
      parameters:
        - $ref: '#/components/parameters/enseigne'
        - $ref: '#/components/parameters/apiKey'
        - name: Entete
          in: query
          required: true
          schema:
            type: integer
          description: Numéro d'entête du ticket
          example: 12345
        - name: format
          in: query
          required: true
          schema:
            type: string
            enum: [receipt, A4]
          description: "Format de rendu du PDF : receipt (ticket de caisse) ou A4"
          example: "receipt"
      responses:
        '200':
          description: Succès, PDF encodé en base64
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    enum: [ok]
                  pdf_content:
                    type: string
                    format: byte
                    description: Contenu du fichier PDF encodé en base64
              example:
                result: ok
                pdf_content: "JVBERi0xLjQKJeLjz9MK...=="
        '400':
          description: Erreur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                result: ko
                error_message: "document not found or download error"
      security:
        - apiKey: []
          enseigne: []

  /import-tickets.do:
    post:
      tags:
        - Tickets
      summary: Importer des tickets de caisse
      description: |
        Importe une liste de tickets (ventes, avoirs, acomptes, réservations, devis, proformas, commandes, BL...).
        Le corps est un **tableau JSON** d'entêtes ; chaque entête contient ses `Lignes` et `Reglements`.
        La réponse renvoie, pour chaque entête, la correspondance entre l'`ID` fourni et le numéro d'`Entete` créé.
      operationId: importTickets
      parameters:
        - $ref: '#/components/parameters/enseigne'
        - $ref: '#/components/parameters/apiKey'
        - name: Magasins_Stocks
          in: query
          required: false
          schema:
            type: string
          description: >
            Liste de magasins (séparés par des virgules) sur lesquels puiser le stock.
            Si renseigné et que la vente présente des produits manquants, des demandes de
            transfert inter-magasins sont générées automatiquement (réceptionnées aussitôt).
            Un magasin expéditeur dépôt, ou réglé « envoi hors magasin = préparation », reçoit
            à la place une préparation (observation « Vente n° »), qu'il contrôle puis expédie ;
            le magasin de la vente réceptionne ensuite le transfert. Un produit sérialisé fait
            revenir au transfert pour un magasin qui n'est pas un dépôt.
          example: "'PARIS','OPERA'"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                properties:
                  ID:
                    type: string
                  Date:
                    type: string
                    format: date
                  Heure:
                    type: string
                  Magasin:
                    type: string
                  Caisse:
                    type: integer
                  Nature:
                    type: string
                    enum: [VENTE, AVOIR, ACOMPTE, RESERVATION, DEVIS, PROFORMA, COMMANDE, BL, "AJUSTEMENT STOCK"]
                  Client:
                    type: integer
                  Vendeur:
                    type: string
                  Utilisateur:
                    type: string
                  Pays_Code3:
                    type: string
                  Observation:
                    type: string
                  Date_Livraison:
                    type: string
                    format: date
                  Adresse_Livraison:
                    type: object
                    properties:
                      Intitule_Adresse:
                        type: string
                      Nom:
                        type: string
                      Adresse1:
                        type: string
                      Adresse2:
                        type: string
                      Adresse3:
                        type: string
                      Code_Postal:
                        type: string
                      Ville:
                        type: string
                      Pays:
                        type: string
                      Contact:
                        type: string
                      Telephone:
                        type: string
                      email:
                        type: string
                  Lignes:
                    type: array
                    items:
                      type: object
                      properties:
                        Produit:
                          type: string
                        Produit_if_not_exists:
                          type: string
                        Couleur:
                          type: string
                        Taille:
                          type: string
                        Designation:
                          type: string
                        Quantite:
                          type: number
                        Prix_Normal:
                          type: number
                        Prix_Vente:
                          type: number
                        Remise_Vente:
                          type: number
                        Motif:
                          type: string
                        Numero_Serie:
                          type: string
                        Taux_TVA:
                          type: number
                        Magasin_Origine:
                          type: string
                          description: >
                            Facultatif. Magasin d'où provient le produit : avant la création du ticket,
                            la ligne est transférée de ce magasin vers `Magasin` (un transfert par
                            magasin d'origine, réceptionné aussitôt, daté du ticket, valorisé au tarif
                            de `Magasin`). Si ce magasin est un dépôt, ou s'il est réglé « envoi hors
                            magasin = préparation », une PRÉPARATION est créée à la place : rien ne
                            bouge avant son expédition, et `Magasin` réceptionne ensuite le transfert
                            (un produit sérialisé fait revenir au transfert pour un magasin qui n'est
                            pas un dépôt). Ignoré s'il vaut `Magasin`. Réservé aux natures VENTE,
                            RESERVATION, COMMANDE et BL, quantité positive. Si un transfert ou une
                            préparation est refusé (stock insuffisant chez l'expéditeur, n° de
                            série...), le ticket n'est pas créé ; les pièces déjà passées pour ce
                            ticket restent acquises.
                  Reglements:
                    type: array
                    items:
                      type: object
                      properties:
                        Montant:
                          type: number
                        ModeReg:
                          type: string
                        Libelle:
                          type: string
                        Echeance:
                          type: string
                          format: date
                        EnteteLiee:
                          type: integer
                        Reference:
                          type: string
            example:
              - Magasin: "OPERA"
                Caisse: 1
                Nature: "VENTE"
                Vendeur: "SERGE"
                Lignes:
                  - Produit: "ANGELA"
                    Couleur: "BLEU"
                    Taille: "S"
                    Designation: "Chemise Angela Coton"
                    Quantite: 1
                    Prix_Vente: 175
                    Taux_TVA: 0
                Reglements:
                  - Montant: 175
                    ModeReg: "300"
                    Libelle: "CARTE BANCAIRE"
                    Reference: "transaction CB 1234"
      responses:
        '200':
          description: |
            Résultat de l'import. `result` vaut `ok` si tous les tickets ont été créés,
            `ko` si au moins une entête est en erreur. `data` liste la correspondance
            ID → Entete (ou ID → Erreur) pour chaque ticket.
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    enum: [ok, ko]
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        ID:
                          type: string
                        Entete:
                          type: integer
                        Erreur:
                          type: string
                        Transferts:
                          type: array
                          items:
                            type: integer
                          description: >
                            Présent si des lignes portaient un `Magasin_Origine` : numéros d'entête
                            des transferts sortants créés avant le ticket (y compris quand le ticket
                            est ensuite en erreur).
                        Preparations:
                          type: array
                          items:
                            type: integer
                          description: >
                            Présent si un `Magasin_Origine` a donné lieu à une préparation (dépôt, ou
                            magasin réglé « envoi hors magasin = préparation ») : numéros d'entête des
                            préparations créées avant le ticket.
              example:
                result: ok
                data:
                  - ID: "CMD-001"
                    Entete: 12345
                    Transferts: [12343]
        '400':
          description: Erreur globale (clé API, JSON invalide, etc.)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                result: ko
                error_message: "bad json"
      security:
        - apiKey: []
          enseigne: []

  # ==================== COMPTEURS ====================
