        Formats de corps acceptés : JSON (tableau d'objets), XLSX, TSV, CSV (séparateur `;`).

        Colonnes obligatoires : `Nature`, `Nom`, `Clef`, `Valeur`.
        Le type de champ perso est créé automatiquement dans `liste_champs_perso` s'il n'existe pas.
        Une `Valeur` vide supprime la valeur existante pour cette `Nature`/`Nom`/`Clef`.
      operationId: importChampsPerso
