  # ==================== IMPORT PRODUITS ====================
  /import-produits.do:
    post:
      tags:
        - Import Produits
      summary: Importer des produits
      description: |
        Import de produits avec leurs déclinaisons (couleurs, tailles).

        **Permission requise :** `import_produits`

        Formats de corps acceptés : JSON (tableau d'objets), XLSX, TSV, CSV (séparateur `;`).
        Le séparateur de champs et de lignes est détecté automatiquement.

        Colonnes obligatoires : `Produit`, `Couleur`, `Taille`.

        Les autres colonnes sont mappées automatiquement sur les colonnes des tables
        `produits`, `skus`, `produits_couleurs`, `produits_tva_pays` et `tarifsproduits`
        (ex. `Designation`, `EAN`, `Reference_Fournisseur`, `Rayon`, `Famille`, `SousFamille`,
        `Marque`, `Fournisseur`, `Saison`, `Saison_Gestion`, `Cle_MEP`, `Force_Produit`,
        `Prix_Achat`, `Remise_Achat`, `Prix_Vente`, `Remise_Vente`, `Taux_TVA_Vente`,
        `Taux_TVA_Achat`, `Conditionnement_Achat`, `Conditionnement_Vente`, `Devise`, `Tarif`...).
        Les valeurs décimales acceptent la virgule.

        Champs personnalisés : préfixer la colonne par `Perso_` (produits),
        `PersoCouleur_` (produits_couleurs) ou `PersoSku_` (skus).

        **Photos produit :** les colonnes `url_photo1` … `url_photo8` permettent de fixer
        les 8 emplacements photo du couple (`Produit`, `Couleur`). Elles ne sont pas
        importées telles quelles : l'API les confie au service **photosync**, qui rend
        la main immédiatement, télécharge les images, les pousse sur le CDN puis rappelle
        cette même API avec les identifiants CDN obtenus dans les colonnes
        `photo1` … `photo8` (colonnes réelles de `produits_couleurs`).

        Le service n'est appelé que si au moins un couple (`Produit`, `Couleur`) porte
        une `url_photoN` non vide. Les photos ne sont donc **pas** en place quand l'import
        répond : la réponse donne le nombre de couleurs confiées (`photos_confiees`) et
        l'identifiant de lot du service (`batch_photos`).

        Une même URL est retéléchargée à chaque import : ne renvoyer `url_photoN` que
        pour les photos réellement nouvelles ou modifiées.

        Les identifiants transmis au service sont toujours relus dans `produits_couleurs` :
        des colonnes `photoN` présentes dans un flux qui contient aussi des `url_photoN`
        sont ignorées. Un emplacement reçu vide dans `photoN` laisse par ailleurs la photo
        existante en place (une photo ne peut pas être effacée par ce biais).

        **Mode mise à jour seule (`update_only=1`) :** aucune création de produit, de
        couleur ni de taille. Seules les lignes dont le sku (`Produit`, `Couleur`, `Taille`)
        existe déjà sont traitées ; les autres sont **ignorées silencieusement** (pas
        d'erreur, l'import reste en succès). Pour ces lignes retenues, toutes les autres
        colonnes du flux sont mises à jour normalement : `produits`, `skus`,
        `produits_couleurs`, `produits_tva_pays`, `tarifsproduits`, champs personnalisés
        et photos.

        Ce mode ne bride que les créations de produits / couleurs / tailles : les **tables
        de référence** continuent d'être alimentées à partir des lignes retenues — un
        `Rayon`, `Famille`, `SousFamille`, `Saison`, `Saison_Gestion`, `Fournisseur`,
        `Tarif`, `Cle_MEP` ou `Force_Produit` inconnu est créé, comme dans un import
        normal, afin de pouvoir être affecté aux produits mis à jour. La complétion
        automatique de la matrice tailles × couleurs est en revanche désactivée : il est
        donc inutile de décliner la matrice complète, on peut n'envoyer que les lignes à
        corriger.

        La réponse porte alors `update_only`, `lignes_importees` (lignes retenues) et
        `lignes_ignorees` (lignes écartées faute de sku existant) — à contrôler, car un
        fichier entièrement hors périmètre répond `ok` avec `lignes_importees: 0`.

        **Attribution automatique des codes EAN (`attribution_ean=1`) :** une fois
        l'import écrit, toute déclinaison **sans EAN** reçoit un code pris sur le
        compteur du dossier (`divers` → `dossier` / `dernier_ean`), clé de contrôle
        EAN-13 comprise. C'est le même compteur et la même séquence que le bouton
        « Compléter les codes EAN » de la fiche produit et que `/attribution-ean.do` :
        aucun code ne peut être distribué deux fois par deux chemins différents.

        Un EAN porté par le fichier **gagne toujours** : l'attribution ne bouche que les
        trous. Le périmètre est le **produit**, pas la ligne — toutes les déclinaisons
        des produits présents dans le flux sont servies, y compris celles que la
        complétion automatique de la matrice tailles × couleurs vient de créer et qui ne
        figurent pas comme lignes du fichier. Corollaire : réimporter une seule ligne
        d'un produit existant complète les EAN manquants de toutes ses déclinaisons.

        Le compteur est lu et **verrouillé** (`select … for update`) le temps de
        l'attribution : deux imports simultanés ne peuvent pas distribuer les mêmes
        codes. Si aucun `dernier_ean` valide n'est paramétré, l'appel échoue plutôt que
        d'importer sans attribuer.

        La réponse porte `eans_attribues` et `dernier_ean` (nouvelle valeur du compteur).
        L'index sur `skus.EAN` n'étant pas unique, un code généré peut théoriquement
        doubler un EAN déjà en place (vrais codes GS1 tombant dans la même plage) :
        le cas échéant la réponse porte en plus `eans_en_doublon`, sans faire échouer
        l'import.
      operationId: importProduits
      parameters:
        - $ref: '#/components/parameters/enseigne'
        - $ref: '#/components/parameters/apiKey'
        - name: reset_tarif
          in: query
          required: false
          schema:
            type: string
          description: >
            Si présent, supprime les tarifsproduits existants des tarifs présents
            dans le fichier (produits non préfixés par `$`) avant réimport.
          example: "1"
        - name: sans_photo_uploader
          in: query
          required: false
          schema:
            type: string
          description: >
            Si présent, les colonnes `url_photo1` … `url_photo8` sont ignorées et le
            service photo-uploader n'est pas appelé.
          example: "1"
        - name: update_only
          in: query
          required: false
          schema:
            type: string
          description: >
            Mode mise à jour seule. Si présent (et différent de `0`), aucun produit,
            aucune couleur et aucune taille n'est créé : les lignes dont le sku
            (`Produit`, `Couleur`, `Taille`) n'existe pas encore sont ignorées, les
            autres sont mises à jour normalement. Les tables de référence (rayons,
            familles, sousfamilles, saisons, fournisseurs, tarifs…) restent alimentées.
            La réponse contient alors `lignes_importees` et `lignes_ignorees`.
          example: "1"
        - name: attribution_ean
          in: query
          required: false
          schema:
            type: string
          description: >
            Attribution automatique des codes EAN. Si présent (et différent de `0`),
            toute déclinaison sans EAN des produits présents dans le flux reçoit un code
            pris sur le compteur du dossier (`dossier` / `dernier_ean`), clé de contrôle
            comprise — même séquence que `/attribution-ean.do`. Les EAN fournis par le
            fichier sont conservés. La réponse contient alors `eans_attribues` et
            `dernier_ean`. Échoue si aucun `dernier_ean` valide n'est paramétré.
          example: "1"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                required:
                  - Produit
                  - Couleur
                  - Taille
                properties:
                  Produit:
                    type: string
                    maxLength: 30
                  Designation:
                    type: string
                    maxLength: 70
                  Couleur:
                    type: string
                    maxLength: 30
                  Taille:
                    type: string
                    maxLength: 30
                  EAN:
                    type: string
                    maxLength: 30
                  Rayon:
                    type: string
                  Famille:
                    type: string
                  SousFamille:
                    type: string
                  Marque:
                    type: string
                  Fournisseur:
                    type: string
                  Prix_Achat:
                    type: number
                  Prix_Vente:
                    type: number
                  Taux_TVA_Vente:
                    type: number
                  Tarif:
                    type: string
                  url_photo1:
                    type: string
                    maxLength: 1000
                    description: >
                      URL de la photo 1 du couple (Produit, Couleur), téléchargée par le
                      service photosync puis rangée dans produits_couleurs.Photo1.
                  url_photo2:
                    type: string
                    maxLength: 1000
                    description: >
                      URL de la photo 2 du couple (Produit, Couleur), téléchargée par le
                      service photosync puis rangée dans produits_couleurs.Photo2.
                  url_photo3:
                    type: string
                    maxLength: 1000
                    description: >
                      URL de la photo 3 du couple (Produit, Couleur), téléchargée par le
                      service photosync puis rangée dans produits_couleurs.Photo3.
                  url_photo4:
                    type: string
                    maxLength: 1000
                    description: >
                      URL de la photo 4 du couple (Produit, Couleur), téléchargée par le
                      service photosync puis rangée dans produits_couleurs.Photo4.
                  url_photo5:
                    type: string
                    maxLength: 1000
                    description: >
                      URL de la photo 5 du couple (Produit, Couleur), téléchargée par le
                      service photosync puis rangée dans produits_couleurs.Photo5.
                  url_photo6:
                    type: string
                    maxLength: 1000
                    description: >
                      URL de la photo 6 du couple (Produit, Couleur), téléchargée par le
                      service photosync puis rangée dans produits_couleurs.Photo6.
                  url_photo7:
                    type: string
                    maxLength: 1000
                    description: >
                      URL de la photo 7 du couple (Produit, Couleur), téléchargée par le
                      service photosync puis rangée dans produits_couleurs.Photo7.
                  url_photo8:
                    type: string
                    maxLength: 1000
                    description: >
                      URL de la photo 8 du couple (Produit, Couleur), téléchargée par le
                      service photosync puis rangée dans produits_couleurs.Photo8.
                  photo1:
                    type: string
                    maxLength: 50
                    description: >
                      Identifiant CDN de la photo 1 (colonne produits_couleurs.Photo1).
                      Renseigné par le retour de photosync, pas par l'appelant : dans un
                      flux contenant des url_photoN, les colonnes photoN sont ignorées.
                      Idem photo2 … photo8.
            example:
              - Produit: "TSHIRT-001"
                Designation: "T-shirt coton"
                Couleur: "BLANC"
                Taille: "M"
                EAN: "3760123456789"
                Rayon: "TEXTILE"
                Famille: "HAUTS"
                Marque: "MARQUE1"
                Prix_Achat: 15.00
                Prix_Vente: 49.90
                url_photo1: "https://mon-pim/photos/tshirt-001-blanc-1.jpg"
                url_photo2: "https://mon-pim/photos/tshirt-001-blanc-2.jpg"
          text/plain:
            schema:
              type: string
              description: Données TSV ou CSV (séparateur `;`) avec ligne d'en-têtes
            example: |
              Produit	Designation	Couleur	Taille	EAN	Prix_Vente
              TSHIRT-001	T-shirt coton	BLANC	M	3760123456789	49.90
          application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: >
            Import réussi. `photos_confiees` et `batch_photos` ne sont présents que si des
            photos ont été confiées au service photosync. `photos_confiees` compte les
            couples (Produit, Couleur) transmis, pas les photos effectivement chargées ;
            `batch_photos` est l'identifiant de lot rendu par le service.
            `update_only`, `lignes_importees` et `lignes_ignorees` ne sont présents que
            si l'appel a été fait avec `update_only`. `eans_attribues` et `dernier_ean`
            ne sont présents que si l'appel a été fait avec `attribution_ean` ;
            `eans_en_doublon` ne l'est qu'en cas de collision détectée.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              examples:
                import:
                  summary: Import standard
                  value:
                    result: ok
                    photos_confiees: 42
                    batch_photos: "d4ca0798-ef22-448d-99dd-89ebf6516e14"
                uploadOnly:
                  summary: Mise à jour seule (update_only=1)
                  value:
                    result: ok
                    update_only: 1
                    lignes_importees: 118
                    lignes_ignorees: 3
                attributionEan:
                  summary: Import avec attribution des EAN manquants (attribution_ean=1)
                  value:
                    result: ok
                    eans_attribues: 56
                    dernier_ean: "1000000011754"
        '400':
          description: Erreur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                result: ko
                error_message: "Colonne Produit non trouvée"
      security:
        - apiKey: []
          enseigne: []

  /import-tarifs.do:
    post:
      tags:
        - Import Produits
      summary: Importer des tarifs
      description: |
        Import de prix de vente par tarif / produit (table `tarifsproduits`).

        **Permission requise :** `import_tarifs`

        Formats de corps acceptés : JSON (tableau d'objets), XLSX, TSV, CSV (séparateur `;`).

        Colonnes : `Tarif` et `Produit` servent de clés ; `Couleur` et `Taille`
        sont prises en compte si présentes. Les autres colonnes ne sont importées
        que si elles correspondent à une colonne de la table `tarifsproduits`
        (ex. `Prix_Vente`, `Remise_Vente`, `Motif`). Les décimales acceptent la virgule.

        Une ligne avec `Prix_Vente = -1` supprime le tarif correspondant.
        Le tarif est créé automatiquement s'il n'existe pas.
      operationId: importTarifs
      parameters:
        - $ref: '#/components/parameters/enseigne'
        - $ref: '#/components/parameters/apiKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                required:
                  - Tarif
                  - Produit
                properties:
                  Tarif:
                    type: string
                  Produit:
                    type: string
                  Couleur:
                    type: string
                  Taille:
                    type: string
                  Prix_Vente:
                    type: number
                  Remise_Vente:
                    type: number
                  Motif:
                    type: string
            example:
              - Tarif: "STANDARD"
                Produit: "TSHIRT-001"
                Couleur: "BLANC"
                Taille: "M"
                Prix_Vente: 49.90
                Remise_Vente: 0
          text/plain:
            schema:
              type: string
              description: Données TSV ou CSV (séparateur `;`) avec ligne d'en-têtes
            example: |
              Tarif	Produit	Couleur	Taille	Prix_Vente	Remise_Vente
              STANDARD	TSHIRT-001	BLANC	M	49.90	0
          application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Import réussi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                result: ok
        '400':
          description: Erreur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                result: ko
                error_message: "invalid api key"
      security:
        - apiKey: []
          enseigne: []

  # ==================== IMPORT MOUVEMENTS ====================
  /import-receptions.do:
    post:
      tags:
        - Import Mouvements
      summary: Importer des réceptions fournisseurs
      description: |
        Import de réceptions de marchandises (table `mouvements_lignes`).

        **Permission requise :** `import_receptions`

        Formats acceptés : JSON, XLSX, TSV, CSV.

        Option `creation_produits=1` (ou `creation-produits`) pour créer automatiquement
        les produits inexistants via l'API import-produits ; dans ce cas des colonnes
        produit supplémentaires sont acceptées (Designation, Marque, Collection, Saison,
        Matiere, Rayon, Famille, SousFamille, Cle_MEP, Modele, Descriptif, Tags, Unite,
        EAN, Tarif, Prix_Vente, Remise_Vente, Motif).
        Les produits peuvent aussi être identifiés par leur code EAN.
      operationId: importReceptions
      parameters:
        - $ref: '#/components/parameters/enseigne'
        - $ref: '#/components/parameters/apiKey'
        - name: creation_produits
          in: query
          required: false
          schema:
            type: integer
            enum: [0, 1]
          description: "Créer les produits inexistants (0 ou 1). Alias : creation-produits"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                required:
                  - Fournisseur
                  - Date
                  - Reference
                  - Produit
                  - Magasin
                  - Nature
                  - Quantite
                  - Prix_Achat
                properties:
                  Fournisseur:
                    type: string
                    description: Doit exister dans la table fournisseurs
                  Date:
                    type: string
                    description: "Date AAAA-MM-JJ ou JJ/MM/AAAA"
                  Reference:
                    type: string
                    description: Référence du bon de réception
                  Nature:
                    type: string
                    enum: [Réception, Livraison]
                  Magasin:
                    type: string
                    description: Doit exister dans la table magasins
                  Produit:
                    type: string
                  Couleur:
                    type: string
                  Taille:
                    type: string
                  Quantite:
                    type: number
                  Prix_Achat:
                    type: number
                  Remise_Achat:
                    type: number
                    description: Optionnel (défaut = 0)
                  Devise:
                    type: string
                    description: Optionnel (défaut = devise du dossier)
                  Taux_Devise:
                    type: number
                    description: Optionnel (résolu depuis la table devises si 0)
                  Commande:
                    type: integer
                    description: Optionnel
                  Colis:
                    type: string
                    description: Optionnel
            example:
              - Fournisseur: "FOURNISSEUR1"
                Date: "2026-02-15"
                Reference: "BL-001"
                Nature: "Réception"
                Magasin: "DEPOT"
                Produit: "TSHIRT-001"
                Couleur: "BLANC"
                Taille: "M"
                Quantite: 100
                Prix_Achat: 15.00
          text/plain:
            schema:
              type: string
              description: Données TSV ou CSV avec en-têtes
          application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
            schema:
              type: string
              format: binary
              description: Fichier XLSX
      responses:
        '200':
          description: Import réussi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                result: ok
        '400':
          description: Erreur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                champ_absent:
                  value:
                    result: ko
                    error_message: "champ Date absent"
                champ_non_renseigne:
                  value:
                    result: ko
                    error_message: "2 ligne(s) avec Prix_Achat non renseigné"
                produit_inconnu:
                  value:
                    result: ko
                    error_message: "1 produits inconnus (TSHIRT-001 BLANC M)"
      security:
        - apiKey: []
          enseigne: []

  /associer-receptions-commandes.do:
    post:
      tags:
        - Import Mouvements
      summary: Associer a posteriori les réceptions aux commandes fournisseurs
      description: |
        Rattache les lignes de réception non encore associées à une commande
        (`mouvements_lignes.Commande = 0`, de nature `Réception` ou `Livraison`)
        aux lignes de commandes fournisseurs **validées**, en respectant le
        fournisseur, le magasin et l'article (produit/couleur/taille).

        **Permission requise :** `import_receptions`

        Règles de calcul :
        - reste à livrer d'une ligne de commande = `Quantite - Quantite_Livree`
          moins les livraisons déjà associées et en attente (`Nature='Livraison'`) ;
        - allocation gloutonne plafonnée à `min(quantité de la ligne de réception, reste à livrer)` ;
        - si une ligne de réception dépasse le reste à livrer d'une commande, elle est
          **éclatée** : la ligne d'origine est ramenée à la quantité allouée et de
          nouvelles lignes sont créées pour les parts suivantes et l'éventuel reliquat
          (laissé sans commande).

        Deux modes :
        - **prévisualisation** (défaut) : renvoie les propositions sans rien modifier ;
        - **application** (`valider=1`) : exécute les associations (transaction) et renvoie un résumé.

        Aucun corps de requête : tous les paramètres sont passés en query string.
      operationId: associerReceptionsCommandes
      parameters:
        - $ref: '#/components/parameters/enseigne'
        - $ref: '#/components/parameters/apiKey'
        - name: valider
          in: query
          required: false
          schema:
            type: integer
            enum: [0, 1]
          description: "1 = appliquer les associations ; 0 ou absent = prévisualisation seule"
        - name: fournisseur
          in: query
          required: false
          schema:
            type: string
          description: "Filtre optionnel sur le fournisseur (recherche partielle, LIKE)"
        - name: magasin
          in: query
          required: false
          schema:
            type: string
          description: "Filtre optionnel sur le magasin (recherche partielle, LIKE)"
        - name: ordre
          in: query
          required: false
          schema:
            type: string
            enum: [ancienne, recente]
            default: ancienne
          description: |
            Ordre d'allocation quand plusieurs commandes éligibles peuvent recevoir une
            même ligne de réception : `ancienne` (la plus ancienne d'abord, défaut) ou
            `recente` (la plus récente d'abord).
        - name: id_mouvement
          in: query
          required: false
          schema:
            type: integer
          description: |
            Filtre optionnel sur une réception précise (`mouvements.id_mouvement`) : seules
            les lignes de ce mouvement sont traitées. Le mouvement doit être de nature
            `Réception` ou `Livraison`, sinon une erreur est renvoyée.
      responses:
        '200':
          description: |
            Succès. En prévisualisation, renvoie la liste des propositions. En application
            (`valider=1`), renvoie un résumé des associations effectuées.
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    description: Réponse en prévisualisation
                    properties:
                      nb_lignes:
                        type: integer
                        description: Nombre de lignes de réception qui seront associées
                      nb_rattachements:
                        type: integer
                        description: Nombre total de rattachements (une ligne peut être éclatée sur plusieurs commandes)
                      propositions:
                        type: array
                        items:
                          type: object
                          properties:
                            Mouvement:
                              type: integer
                              description: Clé de la ligne de réception (mouvements_lignes.Mouvement)
                            Date:
                              type: string
                              description: Date de la réception (AAAA-MM-JJ)
                            Reference:
                              type: string
                            Magasin:
                              type: string
                            Fournisseur:
                              type: string
                            Produit:
                              type: string
                            Couleur:
                              type: string
                            Taille:
                              type: string
                            Nature:
                              type: string
                              enum: [Réception, Livraison]
                            Quantite_Ligne:
                              type: number
                              description: Quantité totale de la ligne de réception
                            Reliquat:
                              type: number
                              description: Part de la ligne laissée sans commande (si éclatement)
                            Associations:
                              type: array
                              items:
                                type: object
                                properties:
                                  Commande:
                                    type: integer
                                  Numero_Commande:
                                    type: string
                                  Date_Commande:
                                    type: string
                                  Quantite:
                                    type: number
                                    description: Quantité allouée à cette commande
                  - type: object
                    description: Réponse en application (valider=1)
                    properties:
                      result:
                        type: string
                        example: ok
                      nb_lignes:
                        type: integer
                      nb_rattachements:
                        type: integer
              examples:
                previsualisation:
                  summary: Prévisualisation (valider absent)
                  value:
                    nb_lignes: 1
                    nb_rattachements: 2
                    propositions:
                      - Mouvement: 4521
                        Date: "2026-02-15"
                        Reference: "BL-001"
                        Magasin: "DEPOT"
                        Fournisseur: "FOURNISSEUR1"
                        Produit: "TSHIRT-001"
                        Couleur: "BLANC"
                        Taille: "M"
                        Nature: "Réception"
                        Quantite_Ligne: 100
                        Reliquat: 0
                        Associations:
                          - Commande: 312
                            Numero_Commande: "CF-000312"
                            Date_Commande: "2026-01-20"
                            Quantite: 60
                          - Commande: 318
                            Numero_Commande: "CF-000318"
                            Date_Commande: "2026-02-02"
                            Quantite: 40
                application:
                  summary: Application (valider=1)
                  value:
                    result: ok
                    nb_lignes: 1
                    nb_rattachements: 2
        '400':
          description: Erreur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                non_autorise:
                  value:
                    result: ko
                    error_message: "not authorized"
                enseigne_inconnue:
                  value:
                    result: ko
                    error_message: "unknown database"
      security:
        - apiKey: []
          enseigne: []

  /import-scanners.do:
    post:
      tags:
        - Import Mouvements
      summary: Importer le contenu d'un scanner
      description: |
        Import du contenu d'un scanner dans la table `scans` (avec `ScannerID=0`).

        **Permission requise :** `import_scanners`

        Formats acceptés : JSON, TSV, CSV. Noms de colonnes insensibles à la casse,
        ordre libre ; toute colonne autre que celles ci-dessous (hormis `Zone`) est ignorée.

        Le body doit comporter au moins 4 colonnes, incluant obligatoirement
        `Produit`, `Couleur`, `Taille`, `Quantite`.

        **Zone** : si le body contient une colonne `Zone`, sa valeur est utilisée ligne par
        ligne ; sinon le paramètre `zone` est appliqué ; si les deux sont vides, la zone prend
        la date et l'heure du jour au format `JJ/MM/AAAA HH:MM`.

        **Contrôles (tout ou rien)** : l'existence de chaque (Produit, Couleur, Taille) est
        vérifiée dans la table `skus`, la quantité doit être numérique ; la moindre erreur
        annule la totalité de l'import.

        Les quantités sont **cumulées** (`Quantite = Quantite + valeur importée`) sur une clé
        (ScannerID, Magasin, Produit, Couleur, Taille, Zone) déjà existante.
      operationId: importScanners
      parameters:
        - $ref: '#/components/parameters/enseigne'
        - $ref: '#/components/parameters/apiKey'
        - name: magasin
          in: query
          required: false
          schema:
            type: string
          description: "Magasin appliqué à toutes les lignes (facultatif)"
        - name: zone
          in: query
          required: false
          schema:
            type: string
          description: "Zone par défaut si absente du body (facultatif). Défaut : date/heure du jour JJ/MM/AAAA HH:MM"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                required:
                  - Produit
                  - Couleur
                  - Taille
                  - Quantite
                properties:
                  Produit:
                    type: string
                    description: Doit exister (combinaison Produit/Couleur/Taille) dans la table skus
                  Couleur:
                    type: string
                  Taille:
                    type: string
                  Quantite:
                    type: number
                  Zone:
                    type: string
                    description: Optionnel ; prioritaire sur le paramètre zone
            example:
              - Produit: "TSHIRT-001"
                Couleur: "BLANC"
                Taille: "M"
                Quantite: 12
                Zone: "ALLEE-A"
          text/plain:
            schema:
              type: string
              description: Données TSV ou CSV avec en-têtes (1ère ligne)
      responses:
        '200':
          description: Import réussi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                result: ok
        '400':
          description: Erreur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                colonne_absente:
                  value:
                    result: ko
                    error_message: "champ Quantite absent"
                quantite_invalide:
                  value:
                    result: ko
                    error_message: "2 ligne(s) avec une quantité invalide (abc)"
                sku_inconnu:
                  value:
                    result: ko
                    error_message: "1 produit(s)/couleur(s)/taille(s) inexistant(s) dans skus (TSHIRT-001 BLANC M)"
      security:
        - apiKey: []
          enseigne: []

  /import-transferts.do:
    post:
      tags:
        - Import Mouvements
      summary: Importer des transferts inter-magasins
      description: |
        Import de mouvements de transfert entre magasins.
        Chaque transfert crée une demande d'expédition depuis le magasin expéditeur vers le magasin destinataire.
        L'option `reception_immediate` permet de valider automatiquement la réception côté destinataire.

        Le champ `observation` est reporté dans le champ *Observation* des **deux** pièces générées
        (le TRANSFERT SORTANT du magasin expéditeur et le TRANSFERT EN ATTENTE du magasin destinataire),
        où il est visible dans le détail du mouvement.
      operationId: importTransferts
      parameters:
        - $ref: '#/components/parameters/enseigne'
        - $ref: '#/components/parameters/apiKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                required:
                  - demande
                  - Magasin_Expediteur
                  - Magasin_Destinataire
                  - Lignes
                properties:
                  demande:
                    type: string
                    enum: [transfert]
                    description: Type de demande (doit être "transfert")
                    example: "transfert"
                  reception_immediate:
                    type: integer
                    enum: [0, 1]
                    default: 0
                    description: "1 = réception automatique côté destinataire, 0 = transfert en attente"
                  observation:
                    type: string
                    maxLength: 100
                    description: |
                      Observation libre reportée dans le champ Observation des deux pièces de transfert
                      (sortant et entrant). Tronquée à 100 caractères.
                    example: "Réassort hebdomadaire"
                  ID:
                    type: string
                    description: Identifiant externe pour le suivi (retourné dans la réponse)
                  Date:
                    type: string
                    format: date
                    description: Date du transfert (défaut = date du jour)
                    example: "2026-02-18"
                  Heure:
                    type: string
                    description: Heure du transfert (défaut = heure courante)
                    example: "14:30:00"
                  Magasin_Expediteur:
                    type: string
                    description: Code du magasin expéditeur
                    example: "DEPOT"
                  Magasin_Destinataire:
                    type: string
                    description: Code du magasin destinataire
                    example: "PARIS01"
                  Caisse:
                    type: integer
                    default: 1
                    description: Numéro de caisse
                  Utilisateur:
                    type: string
                    default: "API"
                    description: Utilisateur qui effectue le transfert
                  Lignes:
                    type: array
                    description: Lignes de produits à transférer
                    items:
                      type: object
                      required:
                        - Produit
                        - Quantite
                      properties:
                        Produit:
                          type: string
                          description: Code produit
                        Couleur:
                          type: string
                          description: Code couleur
                        Taille:
                          type: string
                          description: Code taille
                        Designation:
                          type: string
                          description: Désignation (optionnel, récupéré du produit si vide)
                        Quantite:
                          type: number
                          description: Quantité à transférer (doit être > 0)
                          example: 5
                        Prix_Normal:
                          type: number
                          description: Prix normal (optionnel)
                        Prix_Vente:
                          type: number
                          description: Prix de vente (optionnel)
                        Remise_Vente:
                          type: number
                          description: Remise en % (optionnel)
                        Motif:
                          type: string
                          description: Motif du transfert
                        Numero_Serie:
                          type: string
                          description: Numéro de série (si applicable)
            example:
              - demande: "transfert"
                reception_immediate: 1
                observation: "Réassort hebdomadaire"
                ID: "TRF-001"
                Date: "2026-02-18"
                Magasin_Expediteur: "DEPOT"
                Magasin_Destinataire: "PARIS01"
                Lignes:
                  - Produit: "TSHIRT-001"
                    Couleur: "BLANC"
                    Taille: "M"
                    Quantite: 10
                  - Produit: "TSHIRT-001"
                    Couleur: "NOIR"
                    Taille: "L"
                    Quantite: 5
      responses:
        '200':
          description: Résultat de l'import
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    enum: [ok, ko]
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        ID:
                          type: string
                          description: Identifiant externe fourni
                        Entete:
                          type: integer
                          description: Numéro d'entête créé (si succès)
                        Erreur:
                          type: string
                          description: Message d'erreur (si échec)
              examples:
                success:
                  summary: Import réussi
                  value:
                    result: "ok"
                    data:
                      - ID: "TRF-001"
                        Entete: 12345
                error:
                  summary: Import avec erreur
                  value:
                    result: "ko"
                    data:
                      - ID: "TRF-001"
                        Erreur: "Le magasin expéditeur n'existe pas"
      security:
        - apiKey: []
          enseigne: []

  /import-clients-negoce.do:
    post:
      tags:
        - Négoce B2B
      summary: Importer des clients négoce
      description: |
        Import de fiches clients négoce dans la table `negoce_clients`
        (création ou mise à jour).

        **Permission requise :** `negoce`

        Formats acceptés : JSON, XLSX, TSV, CSV. L'ordre des colonnes est libre ;
        seules les colonnes correspondant à un champ de `negoce_clients` sont importées,
        les autres sont ignorées.

        **Création ou mise à jour.** La colonne `Client`, et elle seule, désigne la fiche à
        modifier : une ligne dont le numéro est renseigné met à jour cette fiche, une ligne
        dont il est vide — ou un fichier sans colonne `Client` — crée une fiche. Un numéro qui
        ne correspond à aucune fiche en crée une portant ce numéro, ce qui permet de reprendre
        une numérotation existante.

        **Mode mise à jour seule.** Avec `update_only=1`, aucune fiche n'est créée : les lignes
        sans numéro de client, et celles dont le numéro ne correspond à aucune fiche, sont
        ignorées et comptées dans `ignorees`. Le fichier doit comporter une colonne `Client`,
        sans quoi l'appel est refusé.

        **Colonnes absentes du fichier.** Elles ne sont jamais modifiées sur une fiche
        existante. À la création, `Tarif`, `Secteur_Geographique`, `Transporteur`,
        `ModeReg` et `Devise` reçoivent la valeur par défaut du dossier, et
        `Date_Creation` la date du jour.

        **Tables de référence alimentées.** Une valeur inconnue portée par `Representant`,
        `Transporteur`, `Secteur_Geographique`, `Langue` ou `Tarif` est créée au passage dans
        `negoce_representants`, `negoce_transporteurs`, `secteurs_geographiques`, `langues`
        et `tarifs` — ces tables ne portent qu'un code et un libellé.

        **Tables de référence contrôlées.** `Devise`, `ModeReg`, `Delai_Reglement` et `magasin`
        désignent au contraire des lignes qui portent du paramétrage qu'un import ne peut pas
        inventer (taux de change, devise et nature du règlement, mois et jours d'échéance).
        Une valeur absente de `devises`, `modesreglement`, `delais_reglements` ou `magasins`
        **arrête l'import** avant toute écriture, en nommant les valeurs en cause.

        **Colonnes non importables.** `Solde`, `Credit_Utilise` et `societe_associee` sont
        tenues par l'application : elles ne sont ni créées ni modifiées par l'import, même si
        elles figurent dans le fichier. `Last_Change` est géré par la base. Ces colonnes, comme
        celles qui ne correspondent à aucun champ de `negoce_clients`, sont rendues dans
        `colonnes_ignorees`.
      operationId: importClientsNegoce
      parameters:
        - $ref: '#/components/parameters/enseigne'
        - $ref: '#/components/parameters/apiKey'
        - name: update_only
          in: query
          required: false
          schema:
            type: string
            enum: ['1']
          description: |
            `1` : mise à jour seule, aucune création. Les lignes non rapprochées sont
            ignorées. Nécessite une colonne de rapprochement.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                properties:
                  Client:
                    type: integer
                    description: |
                      Numéro de fiche. Renseigné, il désigne la fiche à mettre à jour ;
                      vide ou absent, la ligne crée une fiche.
                  code_externe:
                    type: string
                    description: Code du système externe
                  Nom:
                    type: string
                  Contact:
                    type: string
                  Adresse1:
                    type: string
                  Adresse2:
                    type: string
                  Adresse3:
                    type: string
                  Code_Postal:
                    type: string
                  Ville:
                    type: string
                  Pays:
                    type: string
                  Telephone:
                    type: string
                  email:
                    type: string
                  email_billing:
                    type: string
                    description: Adresse de facturation
                  Siret:
                    type: string
                  TVA_CEE:
                    type: string
                  Devise:
                    type: string
                  Tarif:
                    type: string
                  ModeReg:
                    type: string
                  Representant:
                    type: string
                    description: Créé dans negoce_representants s'il n'existe pas
                  Transporteur:
                    type: string
                    description: Créé dans negoce_transporteurs s'il n'existe pas
                  Secteur_Geographique:
                    type: string
                    description: Créé dans secteurs_geographiques s'il n'existe pas
                  Langue:
                    type: string
                    description: Créée dans langues si elle n'existe pas
                  Remise_Habituelle:
                    type: number
                  Credit_Accorde:
                    type: number
                  Actif:
                    type: integer
            example:
              - code_externe: "C0001"
                Nom: "MARTIN SARL"
                Adresse1: "12 rue des Lilas"
                Code_Postal: "75011"
                Ville: "PARIS"
                email: "contact@martin.example.com"
                Siret: "12345678900011"
          text/plain:
            schema:
              type: string
              description: Données TSV ou CSV avec en-têtes
          application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
            schema:
              type: string
              format: binary
              description: Fichier XLSX
      responses:
        '200':
          description: Import réussi
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    enum: [ok]
                  lignes:
                    type: integer
                    description: Nombre de lignes du fichier
                  crees:
                    type: integer
                    description: Nombre de fiches créées
                  modifies:
                    type: integer
                    description: Nombre de fiches mises à jour
                  ignorees:
                    type: integer
                    description: |
                      Lignes écartées faute de fiche correspondante, en mode
                      `update_only`. Toujours 0 sinon.
                  colonnes_ignorees:
                    type: array
                    description: |
                      Colonnes du fichier qui n'ont pas été importées : inconnues de
                      `negoce_clients`, ou tenues par l'application (`Solde`,
                      `Credit_Utilise`, `societe_associee`, `Last_Change`).
                    items:
                      type: string
                  data:
                    type: array
                    description: |
                      Fiches mises à jour, et fiches créées par cet import.
                    items:
                      type: object
                      properties:
                        Client:
                          type: integer
                        Nom:
                          type: string
                        code_externe:
                          type: string
                        Devise:
                          type: string
                        Tarif:
                          type: string
              example:
                result: ok
                lignes: 2
                crees: 1
                modifies: 1
                ignorees: 0
                colonnes_ignorees: []
                data:
                  - Client: 15
                    Nom: "MARTIN SARL"
                    code_externe: "C0001"
                    Devise: "EUR"
                    Tarif: "Negoce"
        '400':
          description: Erreur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                result: ko
                error_message: "Devise : valeur(s) inconnue(s) [ ZZZ ] - a creer dans devises avant l'import"
      security:
        - apiKey: []
          enseigne: []

