# Preduit full stack — local / self-hosted (VM) deployment.
#
#   1. cp .env.production.example .env   and edit it
#   2. docker compose up --build
#   3. frontend → http://localhost:3000   backend → http://localhost:4000
#
# The backend is the live API in backend-ai/. Its databases (serving, Joolan source,
# history), exports and saved outputs live on named volumes so they survive restarts.
#
# Security: with authentication OFF the API has no sign-in, so the backend port is bound to
# this machine only (BACKEND_BIND=127.0.0.1) and FORECASTER_ALLOW_NON_LOCAL lets the container
# accept the forwarded connection. To serve other machines, turn authentication ON
# (FORECASTER_AUTH_ENABLED=true, FORECASTER_AUTH_SECRET, and NEXT_PUBLIC_AUTH_ENABLED=true
# at build time) and then set BACKEND_BIND=0.0.0.0. Never expose it with authentication off.

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: preduit-backend:latest
    ports:
      - "${BACKEND_BIND:-127.0.0.1}:4000:4000"
    env_file:
      - .env
    environment:
      FORECASTER_API_RELOAD: "false"
      FORECASTER_ALLOW_NON_LOCAL: "${FORECASTER_ALLOW_NON_LOCAL:-1}"
      # Exact browser origin(s) of the frontend.
      FORECASTER_CORS_ORIGINS: "${FORECASTER_CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}"
    volumes:
      - preduit-backend-data:/app/backend-ai/data
      - preduit-backend-output:/app/backend-ai/output
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* are baked in at build time. The API URL must be reachable
        # from the user's BROWSER (not the docker network), hence localhost.
        NEXT_PUBLIC_API_URL: "http://localhost:4000/api"
        NEXT_PUBLIC_AUTH_ENABLED: "${NEXT_PUBLIC_AUTH_ENABLED:-false}"
        NEXT_PUBLIC_AUTH_DEV_ROLE: "${NEXT_PUBLIC_AUTH_DEV_ROLE:-admin}"
        NEXT_PUBLIC_AZURE_CLIENT_ID: "${NEXT_PUBLIC_AZURE_CLIENT_ID:-}"
        NEXT_PUBLIC_AZURE_TENANT_ID: "${NEXT_PUBLIC_AZURE_TENANT_ID:-}"
        NEXT_PUBLIC_AZURE_API_SCOPE: "${NEXT_PUBLIC_AZURE_API_SCOPE:-}"
    image: preduit-frontend:latest
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  preduit-backend-data:
  preduit-backend-output:
